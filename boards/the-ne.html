VcmwiOiJodHRwczovL2dpdGh1Yi5jb20vb3JnL3JlcG8vYmxvYi9tYWluL3tmaWxlbmFtZX0ifQ==" filename="boards/le_chiffre.md"><template slot="contents"><div><h1 class="toc-header" id="le-chiffre"><a href="#le-chiffre" class="toc-anchor">¶</a> Le Chiffre</h1>
<p>Le Chiffre is a 30% columnar stagger board designed by tominabox1. It is a unibody split design, and open sourced including all KiCad files.</p>
<p><img width="50%" alt="sickbabies' Le Chiffre, featuring GMK space cadet, and a beige 3DPrinted case from P3D storel >" src="/boards/images/le_chiffre.webp"></p>
<h2 class="toc-header" id="overview"><a href="#overview" class="toc-anchor">¶</a> Overview</h2>
<p>A KLE of the Le Chiffre is available <a class="is-external-link" href="http://www.keyboard-layout-editor.com/#/gists/e44d1c29ae57ab7efbe544ebda2f427c">here</a>. You can optionally install an OLED in the middle, and the middle key can be replaced with a rotary encoder. You can also choose not to install anything in the middle, and leave it plain.</p>
<h2 class="toc-header" id="le-capybara"><a href="#le-capybara" class="toc-anchor">¶</a> Le Capybara</h2>
<p>An electrocapacitive (topre) version of Le chiffre exists, called Le Capybara. The capybara PCB natively supports 35 and 36-key layouts (splitting the 2u spacebars) and requires all of the associated Topre hardware. There is currently no reliable location to source a capybara PCB and plate.</p>
<h2 class="toc-header" id="availability"><a href="#availability" class="toc-anchor">¶</a> Availability</h2>
<h3 class="toc-header" id="open-source"><a href="#open-source" class="toc-anchor">¶</a> Open Source</h3>
<p>The PCB and case files open sourced under the GNU GPL v3 license. The Github repository is <a class="is-external-link" href="https://github.com/tominabox1/Le-Chiffre-Keyboard">here</a>.</p>
<h3 class="toc-header" id="private-buys"><a href="#private-buys" class="toc-anchor">¶</a> Private Buys</h3>
<p>There was a small group buy run by Taco, which enabled a select few to get the board. dezli also had 5 produced by JLCPCB and sold the extras. These buys are enabled by the open source files.</p>
<h3 class="toc-header" id="p3d-store-groupbuy1"><a href="#p3d-store-groupbuy1" class="toc-anchor">¶</a> P3D Store Groupbuy<sup class="footnote-ref"><a id="fnref1" href="#fn1">[1]</a></sup></h3>
<p>P3D Store ran a group buy from December 21st 2020 until January first 2021. Alongside the P3D group buy, 3D printed PLA cases and lasercut acrylic cases were offered, and extras such aa a knob and OLED. The group buy, as of writing, is complete.</p>
<p>P3D Store also sold both Le Chiffre PCBs individually and together for a time but has stopped selling them as of July 31, 2023 due to most of P3D's shop closing down.</p>
